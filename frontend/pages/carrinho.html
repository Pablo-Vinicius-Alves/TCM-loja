<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Carrinho | SmartClothes</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/style.css">
    <style>
        .carrinho-container { padding: 4rem 5%; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 7fr 4fr; gap: 3rem; }
        .tabela-carrinho { width: 100%; border-collapse: collapse; background: var(--superficie); border-radius: var(--raio); box-shadow: var(--sombra); overflow: hidden; }
        .tabela-carrinho th, .tabela-carrinho td { padding: 1.25rem; border-bottom: 1px solid var(--borda); text-align: left; }
        .tabela-carrinho th { background-color: var(--primaria); color: var(--dourado); text-transform: uppercase; font-size: 0.8rem; }
        .btn-qtd { background: var(--primaria); color: var(--dourado); border: 1px solid var(--dourado); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; }
        .qtd-valor { font-weight: 600; width: 30px; text-align: center; display: inline-block; }
        .btn-remover { background: transparent; color: var(--perigo); border: none; font-weight: 600; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; }
        .resumo-pagamento { background: var(--superficie); padding: 2rem; border-radius: var(--raio); box-shadow: var(--sombra); border: 1px solid var(--borda); height: fit-content; }
        .resumo-linha { display: flex; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px dashed var(--borda); padding-bottom: 0.5rem; }
        .total-linha { font-size: 1.3rem; font-weight: 700; color: var(--primaria); border-bottom: none; }
        @media (max-width: 900px) { .carrinho-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">SMARTCLOTHES</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="colecoes.html">Coleções</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="carrinho.html" class="active">Carrinho (<span id="contagem-carrinho">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="carrinho-container">
        <section>
            <h2 class="section-title" style="text-align: left; margin-bottom: 2rem;">Seu Closet Temporário</h2>
            <table class="tabela-carrinho">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Subtotal</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="itens-carrinho"></tbody>
            </table>
        </section>

        <aside class="resumo-pagamento" id="painel-checkout">
            <h3 style="margin-bottom: 1.5rem; text-transform: uppercase; color: var(--primaria); font-size: 1.1rem;">Fechamento</h3>
            <div class="resumo-linha">
                <span>Subtotal</span>
                <span id="resumo-subtotal">R$ 0,00</span>
            </div>
            <div class="resumo-linha total-linha">
                <span>Total</span>
                <span id="resumo-total">R$ 0,00</span>
            </div>

            <form id="form-pagamento" style="margin-top: 2rem; display: flex; flex-direction: column; gap: 12px;">
                <div class="campo">
                    <label>Número do Cartão</label>
                    <input type="text" placeholder="0000 0000 0000 0000" required>
                </div>
                <div class="grade">
                    <div class="campo"><label>Data de Entrega</label><input type="text" placeholder="MM/AA" required></div>
                    <div class="campo"><label>Numero da Casa</label><input type="text" placeholder="123" required></div>
                </div>
                <button type="submit" class="btn btnbloco" style="margin-top: 1rem;">Efetuar Pagamento</button>
            </form>
        </aside>
    </main>

    <script src="/frontend/js/"></script>
</body>
</html>
