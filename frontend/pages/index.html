<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartClothes</title>
    <link rel="icon" type="image/jpeg" href="../imag/logoDaMarca.jpg">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Header Único -->
    <header>
        <div class="logo">SMARTCLOTHES</div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Início</a></li>
                <li><a href="colecoes.html">Coleções</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="carrinho.html">Carrinho (<span id="contagem-carrinho">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner Principal -->
    <section class="carousel-container">
        <div class="carousel-slide">
            <div class="carousel-content">
                <h1>Coleção de Inverno</h1>
                <p style="letter-spacing: 4px; margin-bottom: 2rem; font-family: system-ui;">Coleção: Crepúsculo Dourado </p>
                <a href="colecoes.html" class="btn-gold">Descubra</a>
            </div>
        </div>
    </section>

    <!-- Vitrine Ilimitada (Ano Todo) -->
    <!-- Vitrine Ilimitada com Exatamente 3 Roupas Reais Modais -->
    <section class="vitrine-section">
        <h2 class="section-title">Estilo para o Ano Todo</h2>
        <div class="products-grid">
      
      <!-- ROUPA 1: Blazer Alfaiataria Premium -->
    <div class="product-card">
        <div class="product-image-placeholder">
        <img src="../imag/images (2).jpg" alt="Blazer Cravejado">
        </div>
        <div class="product-title">Terno Slim Fit Casual</div>
        <div class="product-price">R$ 599,00</div>
        <button class="btn-gold" style="padding: 0.5rem 1.5rem; font-size: 0.8rem;">Adicionar</button>
      </div>

      <!-- ROUPA 2: Vestido e Malha Elegante -->
      <div class="product-card">
        <div class="product-image-placeholder">
          <img src="../imag/cf304a7455fe18cfe8936889e975e63e.jpg" alt="Vestido Folheado a Ouro">
        </div>
        <div class="product-title">Blusa de Lã Premium</div>
        <div class="product-price">R$ 780,00</div>
        <button class="btn-gold" style="padding: 0.5rem 1.5rem; font-size: 0.8rem;">Adicionar</button>
      </div>

      <!-- ROUPA 3: Sobretudo Imperial Velvet -->
      <div class="product-card">
        <div class="product-image-placeholder">
          <img src="../imag/images (1).jpg" alt="Vestido de lã Roxa">
        </div>
        <div class="product-title">Sobretudo Casual Urbano</div>
        <div class="product-price">R$ 749,00</div>
        <button class="btn-gold" style="padding: 0.5rem 1.5rem; font-size: 0.8rem;">Adicionar</button>
      </div>

    </div>
  </section>

    <script src="../js/carrinho.js"></script>
