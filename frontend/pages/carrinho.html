<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Carrinho | SmartClothes</title>
  <!-- Buscando as fontes de revista de moda -->
  <link href="https://googleapis.com" rel="stylesheet">
  <!-- Chamando o CSS global unificado (Roxo e Dourado) -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Barra de Navegação Superior Unificada -->
  <header>
    <div class="logo">SMARTCLOTHES</div>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="colecoes.html">Coleções</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="carrinho.html" class="active">Carrinho (<span id="contagem-carrinho">0</span>)</a></li>
      </ul>
    </nav>
  </header>

  <!-- Container Geral do Carrinho (Usa o Grid de duas colunas do CSS) -->
  <main class="carrinho-container">
    
    <!-- Coluna da Esquerda: Lista de Roupas Escolhidas -->
    <section>
      <h2 class="section-title" style="text-align: left; margin-bottom: 2rem;">Seu Closet Temporário</h2>
      <table class="tabela-carrinho">
        <thead>
          <tr>
            <th>Produto</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Subtotal</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="itens-carrinho">
          <!-- O arquivo carrinho.js vai colocar as roupas jogadas aqui de forma dinâmica -->
        </tbody>
      </table>
    </section>

    <!-- Coluna da Direita: Resumo Financeiro e Checkout de Cartão -->
    <aside class="resumo-pagamento" id="painel-checkout">
      <h3 style="margin-bottom: 1.5rem; text-transform: uppercase; color: var(--primaria); font-size: 1.1rem; letter-spacing: 1px;">Fechamento</h3>
      
      <div class="resumo-linha">
        <span>Subtotal</span>
        <span id="resumo-subtotal">R$ 0,00</span>
      </div>
      <div class="resumo-linha total-linha">
        <span>Total</span>
        <span id="resumo-total">R$ 0,00</span>
      </div>

      <!-- Formulário de Pagamento da Roupa -->
      <form id="form-pagamento" style="margin-top: 2rem; display: flex; flex-direction: column; gap: 14px;">
        <h4 style="font-size: 0.8rem; text-transform: uppercase; color: var(--texto-suave); letter-spacing: 0.5px;">Checkout de Crédito</h4>
        
        <div class="campo">
          <label for="num-cartao">Número do Cartão</label>
          <input id="num-cartao" type="text" placeholder="0000 0000 0000 0000" required autocomplete="cc-number">
        </div>
        
        <div class="grade">
          <div class="campo">
            <label for="val-cartao">Validade</label>
            <input id="val-cartao" type="text" placeholder="MM/AA" required autocomplete="cc-exp">
          </div>
          <div class="campo">
            <label for="cvv-cartao">CVV</label>
            <input id="cvv-cartao" type="text" placeholder="123" required autocomplete="cc-csc">
          </div>
        </div>
        
        <button type="submit" class="btn btnbloco" style="margin-top: 1rem;">Efetuar Pagamento</button>
      </form>
    </aside>
  </main>

  <!-- Chamando a inteligência JavaScript que faz a tabela somar e alterar as quantidades -->
  <script src="../js/carrinho.js"></script>
</body>
</html>
