<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coleções SmartClothes</title>
  <link rel="icon" type="image/jpeg" href="../imgs/logoDaMarca.jpg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/colecoes.css">
  <link rel="stylesheet" href="../css/loja.css">
</head>

<body>

  <header>
    <a href="index.html" class="marca-cabecalho">
      <img src="../imgs/logoDaMarca.jpg" alt="Logo SmartClothes" class="imagem-logo">
      <span class="texto-logo">SMARTCLOTHES</span>
    </a>
    <nav>
      <input type="search" id="campo-busca" placeholder="Buscar produtos por nome...">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="colecoes.html" class="ativo">Coleções</a></li>
        <li><a href="auth.html">Login</a></li>
        <li><a href="carrinho.html">Carrinho (<span id="contagem-carrinho">0</span>)</a></li>
        <li>
          <a href="perfil.html" title="Minha Conta" aria-label="Minha Conta"
            style="display: inline-flex; align-items: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <p id="aviso-colecoes" class="aviso" role="alert" hidden></p>

  <div id="lista-colecoes"></div>

  <dialog id="modal-produto" class="modal-detalhes">
    <div class="modal-conteudo">
      <button type="button" id="fechar-modal" class="btn-fechar-modal" aria-label="Fechar">&times;</button>
      <img id="modal-imagem" src="" alt="" class="modal-img">
      <div class="modal-info">
        <h2 id="modal-nome"></h2>
        <p id="modal-descricao" class="modal-desc"></p>
        <p id="modal-estoque" class="modal-est"></p>
        <p id="modal-preco" class="modal-prc"></p>
        <button type="button" id="modal-btn-comprar" class="botao-dourado">Adicionar ao Carrinho</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="../js/colecoes.js"></script>
</body>

</html>
