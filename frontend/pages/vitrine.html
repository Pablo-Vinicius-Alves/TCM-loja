<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine | TCM Loja</title>
  <link rel="stylesheet" href="/frontend/css/vitrine.css">
</head>
<body>

  <header class="header">
    <div class="header__conteudo">
      <h1 class="header__logo">TCM Loja</h1>
      <div class="header__acoes">
        <button id="btn-carrinho" class="btn btn--icone" aria-label="Ver Carrinho">
         Carrinho (<span id="carrinho-contador">0</span>)
        </button>
        <div id="usuario-container">
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <h2>Nossos Produtos</h2>
    <div id="grade-produtos" class="grade-produtos">
    </div>
  </main>

  <dialog id="modal-auth" class="modal">
    <div class="modal__conteudo">
      <button id="modal-fechar" class="modal__fechar" aria-label="Fechar">&times;</button>
      <div class="modal__corpo">
        <span class="modal__icone"></span>
        <h3>Faça login para continuar</h3>
        <p>Você precisa estar conectado à sua conta para adicionar itens ao carrinho.</p>
        <div class="modal__acoes">
          <a href="/pages/login.html" class="btn btn--primario btn--bloco">Entrar na Conta</a>
          <a href="/pages/login.html#criar" class="btn btn--secundario btn--bloco">Criar nova conta</a>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="/frontend/js/vitrine.js"></script>
</body>
</html>
