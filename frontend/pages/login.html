<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | SmartClothes</title>
  <!-- Ícone da marca na aba do navegador -->
  <link rel="icon" type="image/jpeg" href="../imag/logoDaMarca.jpg">
  <!-- CSS principal e CSS exclusivo da tela de acesso -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <!-- DIVISÃO GERAL: TELA DIVIDIDA EM APRESENTAÇÃO E FORMULÁRIO -->
  <div class="tela-acesso">

    <!-- DIVISÃO 1 (ESQUERDA): APRESENTAÇÃO LUXUOSA DA MARCA -->
    <aside class="painel-marca">
      <div class="cabecalho-marca-acesso">
        <img src="../imag/logoDaMarca.jpg" alt="Logo SmartClothes" class="logo-acesso">
        <span class="nome-marca-acesso">SMARTCLOTHES</span>
      </div>
      <h1>Bem-vindo à nossa grife</h1>
      <p>Entre na sua conta para conferir coleções exclusivas, salvar seus favoritos e acompanhar seus pedidos.</p>
    </aside>

    <!-- DIVISÃO 2 (DIREITA): CARTÃO DE LOGIN E BOTÃO PARA CADASTRO -->
    <main class="painel-formulario">
      <div class="cartao-formulario">

        <h2 class="titulo-formulario">Identifique-se</h2>
        <p class="subtitulo-formulario">Digite seus dados para acessar a loja.</p>

        <!-- Caixa que mostra erros ou sucesso -->
        <div id="caixa-alerta" class="caixa-alerta" role="alert" hidden></div>

        <!-- Formulário de Login -->
        <form id="formulario-login" class="formulario-lista" novalidate>
          <div class="grupo-campo">
            <label for="campo-usuario-login">Usuário</label>
            <input id="campo-usuario-login" type="text" placeholder="Digite seu usuário" required>
          </div>

          <div class="grupo-campo">
            <label for="campo-senha-login">Senha</label>
            <input id="campo-senha-login" type="password" placeholder="Digite sua senha" required>
          </div>

          <button id="botao-entrar" class="botao-principal botao-largura-total" type="submit">Entrar na Loja</button>
        </form>

        <!-- Botão destacado para ir direto para a página de Cadastro -->
        <div class="divisor-cadastro">
          <p>Ainda não faz parte da SmartClothes?</p>
          <a href="cadastro.html" class="botao-dourado botao-largura-total">Criar Minha Conta</a>
        </div>

      </div>
    </main>

  </div>

  <!-- Script que conecta o login com o servidor e redireciona para a página principal -->
  <script type="module" src="../js/auth.js"></script>
</body>
</html>
