<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu Carrinho | SmartClothes</title>
  <link rel="icon" type="image/jpeg" href="../imgs/logoDaMarca.jpg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/carrinho.css">
  <link rel="stylesheet" href="../css/loja.css">
</head>

<body>

  <header>
    <a href="index.html" class="marca-cabecalho">
      <img src="../imgs/logoDaMarca.jpg" alt="Logo SmartClothes" class="imagem-logo">
      <span class="texto-logo">SMARTCLOTHES</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="colecoes.html">Coleções</a></li>
        <li><a href="auth.html">Login</a></li>
        <li><a href="carrinho.html" class="ativo">Carrinho (<span id="contagem-carrinho">0</span>)</a></li>
        <li>
          <a href="perfil.html" title="Minha Conta" aria-label="Minha Conta"
            style="display: inline-flex; align-items: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="area-carrinho">
    <section>
      <h2 class="titulo-secao" style="text-align: left; margin-bottom: 2rem;">Seu Carrinho</h2>
      <p id="aviso-carrinho" class="aviso" role="alert" hidden></p>

      <table class="tabela-carrinho">
        <thead>
          <tr>
            <th>Produto</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th>Subtotal</th>
            <th><span class="visually-hidden">Remover</span></th>
          </tr>
        </thead>
        <tbody id="itens-carrinho" aria-live="polite"></tbody>
        <tfoot>
          <tr class="carrinho-total-linha">
            <td colspan="3">Total</td>
            <td id="total-carrinho">R$ 0,00</td>
            <td></td>
          </tr>
        </tfoot>
      </table>

      <div class="carrinho-acoes">
        <a class="botao-dourado" href="colecoes.html">Continuar comprando</a>
        <button id="btn-esvaziar" class="botao-dourado" type="button" disabled>Esvaziar carrinho</button>
        <button id="btn-finalizar" class="botao-principal" type="button">Finalizar compra</button>
      </div>
    </section>
  </main>

  <script type="module" src="../js/carrinho.js"></script>
</body>

</html>
